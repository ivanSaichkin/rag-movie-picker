[project]
name = "movie-picker-rag"
version = "0.1.0"
description = "Hybrid movie retrieval and gRPC RAG service"
requires-python = ">=3.12,<3.14"
dependencies = [
  "grpcio>=1.84,<2",
  "grpcio-health-checking>=1.84,<2",
  "protobuf>=7.36.2,<8",
  "qdrant-client>=1.16,<2",
  "httpx>=0.28,<1",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.12,<3",
  "filelock>=3.20,<4",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=5.7,<6"]

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.15,<1", "grpcio-tools>=1.84,<1.85"]

[project.scripts]
movie-rag = "movie_rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/movie_rag", "src/rag"]

[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = ["src/rag"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: in-process Qdrant and real gRPC transport", "model: optional locally cached transformer model"]
