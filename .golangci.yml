version: "2"

run:
  timeout: 5m

linters:
  default: standard
  exclusions:
    rules:
      # Test DSNs contain dummy credentials; G101 is about production secrets.
      - path: _test\.go
        linters:
          - gosec
        text: G101
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nilerr
    - noctx
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - unparam
    - whitespace

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/ivanSaichkin/rag-movie-picker
