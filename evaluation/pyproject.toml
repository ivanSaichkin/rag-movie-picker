[project]
name = "movie-picker-evaluation"
version = "0.1.0"
description = "Quality and latency benchmarks for the gRPC movie recommender"
requires-python = ">=3.12,<3.14"
dependencies = ["grpcio>=1.84,<2", "protobuf>=7.36.2,<8"]

[dependency-groups]
dev = ["ruff>=0.15,<1"]

[tool.uv]
package = false

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
