syntax = "proto3";
package rag.v1;
option go_package = "github.com/ivanSaichkin/rag-movie-picker/pkg/ragapi/rag/v1;ragv1";

service RagService {
  rpc Recommend(RecommendRequest) returns (RecommendResponse);
  rpc GetMovie(GetMovieRequest) returns (Movie);
  rpc GetCatalog(GetCatalogRequest) returns (Catalog);
  rpc InspectRecommendation(RecommendRequest) returns (RecommendationInspection);
}

message Filters {
  repeated int64 genre_ids = 1;
  optional int32 year_from = 2;
  optional int32 year_to = 3;
  optional double min_rating = 4;
}
message RecommendRequest {
  string query = 1;
  optional uint32 limit = 2;
  Filters filters = 3;
  optional string strategy = 4;
  optional bool generate_explanations = 5;
  optional uint32 candidate_limit = 6;
  // Skip LLM query preparation and final reranking for this request.
  bool disable_llm = 7;
}
message Genre { int64 id = 1; string name = 2; }
message Movie {
  int64 movie_id = 1;
  string title = 2;
  optional int32 year = 3;
  repeated Genre genres = 4;
  optional double rating = 5;
  int64 vote_count = 6;
  string overview = 7;
}
message Recommendation { Movie movie = 1; optional string reason = 2; }
message Warning { string code = 1; string message = 2; }
message RecommendResponse {
  string mode = 1;
  string strategy_used = 2;
  repeated Recommendation items = 3;
  repeated Warning warnings = 4;
  // One explanation for the complete selection; legacy per-item reason remains readable.
  optional string explanation = 5;
  // Absent for retrieval-only results; false means items, if any, are alternatives.
  optional bool has_matches = 6;
}
message GetMovieRequest { int64 movie_id = 1; }
message GetCatalogRequest {}
message Catalog {
  repeated Genre genres = 1;
  uint32 movie_count = 2;
  optional int32 year_from = 3;
  optional int32 year_to = 4;
  uint32 default_results = 5;
  uint32 max_results = 6;
  repeated string available_strategies = 7;
  string default_strategy = 8;
  uint32 max_candidates = 9;
}

message DiagnosticCandidate { Movie movie = 1; double score = 2; }
message LLMAttempt {
  uint32 attempt = 1;
  double elapsed_ms = 2;
  optional uint32 http_status = 3;
  string provider_response = 4;
  string content = 5;
  string error = 6;
  bool truncated = 7;
}
message LLMCallTrace {
  string stage = 1;
  string request_json = 2;
  double elapsed_ms = 3;
  string validation_error = 4;
  repeated LLMAttempt attempts = 5;
  bool request_truncated = 6;
}
message RequestDiagnostics {
  uint32 requested_candidate_limit = 1;
  repeated DiagnosticCandidate candidates = 2;
  repeated int64 llm_candidate_ids = 3;
  repeated LLMCallTrace llm_calls = 4;
  map<string, double> timings_ms = 5;
}
message RecommendationInspection {
  RecommendResponse response = 1;
  RequestDiagnostics diagnostics = 2;
  string error_code = 3;
  string error_message = 4;
}
