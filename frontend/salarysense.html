<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <meta name="theme-color" content="#11110f">
  <title>SalarySense — база знаний</title>
  <link rel="stylesheet" href="./styles.css?v=10">
  <link rel="stylesheet" href="./salarysense.css">
  <script type="module" src="./salarysense.js"></script>
</head>
<body>
  <a class="skip-link" href="#workspace">К основному содержанию</a>
  <div class="app-shell knowledge-shell">
    <aside class="sidebar" aria-label="База знаний">
      <div class="sidebar-header">
        <a class="brand" href="./">SalarySense</a>
        <button class="button new-chat" id="new-chat" type="button">Новый чат</button>
      </div>
      <p class="sidebar-note" id="corpus-note"></p>
    </aside>

    <main class="workspace" id="workspace" tabindex="-1">
      <header class="workspace-header">
        <h1>База знаний</h1>
        <span class="knowledge-mode muted" id="mode" role="status">Подключаемся…</span>
      </header>

      <div class="chat-stage" id="chat-stage">
        <section class="welcome" id="welcome" aria-labelledby="welcome-title">
          <h2 id="welcome-title">Что вы хотите узнать?</h2>
          <p>Спросите о зарплатах, проверке навыков или подборе вакансий в SalarySense.</p>
          <div class="suggestions" id="suggestions">
            <button class="button" type="button" data-question="Что произойдёт с рынком и зарплатами, если я поменяю регион или формат работы?">Зарплаты и регионы</button>
            <button class="button" type="button" data-question="Что именно показывает результат проверки и почему по нему нельзя присвоить senior или lead?">Проверка навыков</button>
            <button class="button" type="button" data-question="Как понять, откуда взялось совпадение с вакансией и почему высокий процент не скрывает обязательный пробел?">Совпадение с вакансией</button>
          </div>
        </section>
        <div class="knowledge-messages" id="messages" role="log" aria-label="Вопросы и ответы"></div>
      </div>

      <div class="composer-dock">
        <form class="composer" id="chat-form">
          <div class="composer-input">
            <label class="sr-only" for="query">Вопрос о SalarySense</label>
            <textarea id="query" name="query" rows="1" maxlength="1000" placeholder="Задайте вопрос по документам…" required></textarea>
            <button class="button primary-button icon-button send-button" id="send-button" type="submit" aria-label="Отправить вопрос">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20V4m-7 7 7-7 7 7"/></svg>
            </button>
          </div>
        </form>
        <button class="button icon-button theme-toggle" id="theme-toggle" type="button" aria-label="Светлая тема" aria-pressed="false">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </main>
  </div>
</body>
</html>
