name: RAG gRPC contract

on:
  push:
    branches: [main, development, "ml_*"]
    paths:
      - "proto/rag/**"
      - "pkg/ragapi/**"
      - "rag/src/rag/**"
      - "rag/pyproject.toml"
      - "rag/uv.lock"
      - "rag/scripts/generate-proto.ps1"
      - ".github/workflows/rag-contract.yml"
  pull_request:
    branches: [main, development]
    paths:
      - "proto/rag/**"
      - "pkg/ragapi/**"
      - "rag/src/rag/**"
      - "rag/pyproject.toml"
      - "rag/uv.lock"
      - "rag/scripts/generate-proto.ps1"
      - ".github/workflows/rag-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  contract:
    name: Generated clients and Go tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: pkg/ragapi/go.mod
          cache-dependency-path: pkg/ragapi/go.sum
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          working-directory: rag
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install locked Python generators
        working-directory: rag
        run: uv sync --locked --group dev
      - name: Install pinned Go generators
        env:
          GOBIN: ${{ runner.temp }}/rag-protoc
        run: |
          mkdir -p "$GOBIN"
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.6
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
      - name: Regenerate both clients
        env:
          PROTOC_PLUGINS: ${{ runner.temp }}/rag-protoc
        run: |
          rag/.venv/bin/python -m grpc_tools.protoc \
            -Iproto \
            --python_out=rag/src \
            --grpc_python_out=rag/src \
            --plugin=protoc-gen-go="$PROTOC_PLUGINS/protoc-gen-go" \
            --plugin=protoc-gen-go-grpc="$PROTOC_PLUGINS/protoc-gen-go-grpc" \
            --go_out=pkg/ragapi --go_opt=paths=source_relative \
            --go-grpc_out=pkg/ragapi --go-grpc_opt=paths=source_relative \
            proto/rag/v1/rag.proto
      - name: Check generated clients are committed and up to date
        run: |
          git diff --exit-code -- rag/src/rag pkg/ragapi/rag
          untracked="$(git ls-files --others --exclude-standard -- rag/src/rag pkg/ragapi/rag)"
          if [[ -n "$untracked" ]]; then
            printf 'Untracked generated files:\n%s\n' "$untracked"
            exit 1
          fi
      - name: Check Go formatting
        working-directory: pkg/ragapi
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf 'Go files need formatting:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Verify Go dependencies
        working-directory: pkg/ragapi
        run: go mod verify
      - name: Vet Go contract
        working-directory: pkg/ragapi
        run: go vet ./...
      - name: Test Go contract
        working-directory: pkg/ragapi
        run: go test -race -count=1 ./...
